# Continuous integration.
#
# ────────────────────────────────────────────────────────────────────────────────────────────────
# THE `check` AND `image` JOBS ARE TEMPORARY, exactly as they are in `micro-explorer-web`,
# `micro-admin-web`, `micro-mint-web`, `micro-trade-web` and `micro-hub-web`. The org's reusable
# `web-ci.yml` is the target and the `hygiene` and `publish` jobs already call the org repository;
# the two local jobs exist for one reason and disappear with it:
#
#   @cloudsforge/ui is unpublished, and this repository consumes it as `link:../ui/packages/ui`.
#   The reusable workflow does a single checkout and then `pnpm install --frozen-lockfile`, which
#   cannot resolve a sibling directory that is not there.
#
# ONE INPUT OF THE REUSABLE WORKFLOW WILL STILL NOT SUIT THIS REPOSITORY, and it is the same
# exception explorer-web takes: its `image` job probes a deep route and requires a 200 for ANY
# address. This app's nginx.conf enumerates its real routes and answers 404 for everything else ON
# PURPOSE, so the image is probed here, where the honest answer can be asserted as well as the deep
# link. `/payouts` returning 404 is a product requirement on this surface, not an accident.
#
# THE SIBLING CHECKOUTS ARE NOT DECORATION. Three of this repository's tests cross-check another
# repository and SKIP when it is absent, so that `pnpm test` passes for somebody who cloned only
# this one. A skipped test is an unmeasured one, so on the runner the absence has to be fatal —
# otherwise a checkout that silently produced nothing looks exactly like a green cross-check. The
# "were actually checked" steps below are what make that so.
# ────────────────────────────────────────────────────────────────────────────────────────────────

name: CI

on:
  push:
    # `release/**` builds too. A release branch carries the estate-wide version bump and has to
    # publish its images before testnet can be deployed from it.
    branches: [main, 'design-system/**', 'release/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { path: pool-web }

      # The design system, consumed as `link:../ui/packages/ui`.
      #
      # `|| github.token` and not a bare secret. Measured on 2026-08-09: this repository was new,
      # ESTATE_READ_TOKEN had not been set on it yet, and `token: ${{ secrets.ESTATE_READ_TOKEN }}`
      # resolved to the EMPTY STRING — which actions/checkout does not treat as "use the default",
      # it treats as a supplied-but-invalid input and dies with `Input required and not supplied:
      # token` before it has said which repository it was trying to read. The named secret stays
      # first because it is the estate's convention and because these siblings were private until
      # recently; the fallback is what micro-org's own publish-image.yml does, for the same reason
      # its comment gives: it "falls back to the job token, which is enough while those
      # repositories are public".
      - uses: actions/checkout@v4
        with:
          repository: cloudsforge-online/micro-ui
          path: ui
          token: ${{ secrets.ESTATE_READ_TOKEN || github.token }}

      # micro-brand, for test/brand-chrome.test.ts. The favicons and the og card in public/ are
      # COPIES of Forge Network's, and a copy that is never compared is a copy that drifts.
      - uses: actions/checkout@v4
        with:
          repository: cloudsforge-online/micro-brand
          path: brand
          token: ${{ secrets.ESTATE_READ_TOKEN || github.token }}

      # micro-pool, for test/pool-contract.test.ts. Every response shape this bundle reads was
      # taken off that service's handlers, and so is the answer to which of its routes take a
      # credential; checking it out is what stops both becoming a description of an API that has
      # since changed. It is read from `main` and not from a pin, because a pin would go on
      # reporting green against a copy the estate stopped deploying.
      #
      # The fallback that used to follow this step — take `feat/stratum-v1-pool` when main has no
      # `src/server.ts` — is deleted, as its own comment asked. That pull request is micro-pool#1
      # and it merged; the branch, the `fetch-depth: 0` it needed and the warning it printed are all
      # answering a question nobody is asking now.
      - uses: actions/checkout@v4
        with:
          repository: cloudsforge-online/micro-pool
          path: pool
          token: ${{ secrets.ESTATE_READ_TOKEN || github.token }}

      # Pinned, because the checkout lives at pool-web/ and the action looks for the packageManager
      # field in the workspace root, where there is no package.json.
      - uses: pnpm/action-setup@v4
        with: { version: 11.9.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: pool-web/pnpm-lock.yaml }

      # `link:` resolves to the sibling's own node_modules, so the design system must be installed
      # before this repository is — without this, `tsc` cannot resolve ../ui's own imports when it
      # typechecks the linked sources.
      - name: Install the sibling design system
        run: pnpm --dir ui install --frozen-lockfile

      - name: Install
        working-directory: pool-web
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: pool-web
        run: pnpm typecheck

      - name: Test
        working-directory: pool-web
        run: pnpm test

      - name: The cross-repository checks actually ran
        working-directory: pool-web
        run: |
          set -euo pipefail
          test -f ../pool/src/server.ts || {
            echo "::error::micro-pool was not checked out; the response shapes were never verified"
            exit 1
          }
          test -d ../brand/assets/network || {
            echo "::error::micro-brand was not checked out; the favicons were never compared"
            exit 1
          }
          # A skip is reported by the runner as a pass. Fail if either file reported one.
          out=$(node --import tsx --import @cloudsforge/ui/test-loader --test \
                  test/brand-chrome.test.ts test/pool-contract.test.ts 2>&1 || true)
          # THE SUMMARY LINE IS READ THROUGH TWO LAYERS OF REPORTER INCIDENTAL DETAIL, and both were
          # measured rather than guessed:
          #
          #   - WHICH PREFIX. Piped output is TAP on Node 22 (`# skipped 1`) and `spec` on Node 24
          #     (`ℹ skipped 1`). A pattern that knows only the TAP form goes silent the day
          #     `node-version:` above moves — the gate failing exactly as the thing it guards fails.
          #   - COLOUR. The spec reporter emits the line as `\e[34mℹ skipped 1\e[39m`, so `^ℹ` does
          #     not match it. Stripped first, because a gate that cannot see a skip reports a pass.
          #
          # A here-string rather than a pipe: `grep -q` exits on its first match, the producer then
          # writes into a closed pipe, and `pipefail` promotes that SIGPIPE to a failed step — a
          # gate that fails for no reason and passes on re-run teaches re-running instead of reading.
          plain=$(perl -pe 's/\e\[[0-9;]*m//g' <<<"$out")
          if grep -qE '^(# |ℹ )skipped [1-9]' <<<"$plain"; then
            printf '%s\n' "$out"
            echo "::error::a cross-repository test skipped on the runner, where the sibling is present"
            exit 1
          fi
          echo "ok: the sibling checkouts were read"

      - name: Build
        working-directory: pool-web
        run: pnpm build

      - name: The brand chrome reached the build output
        # Committing the bytes and shipping them are two different claims. The web template's
        # Dockerfile once did not copy public/ into the build context, so four frontends shipped an
        # image with no icon in it while their own brand test passed.
        working-directory: pool-web
        run: |
          set -euo pipefail
          for asset in favicon-32x32.png favicon-192x192.png favicon-512x512.png og-1200x630.png; do
            test -f "dist/$asset" || { echo "::error::dist/$asset is missing from the build output"; exit 1; }
          done
          echo "ok: the favicons and the og card are in dist"

  rules:
    name: Estate rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ────────────────────────────────────────────────────────────────────────────────────────
      # EVERY RULE BELOW IS ALREADY A TEST. It is repeated here so that deleting the test does not
      # silently delete the rule — which is the failure mode of a repository whose most important
      # claims are enforced only by files that same commit is allowed to touch.
      # ────────────────────────────────────────────────────────────────────────────────────────

      - name: No build-time configuration
        # A `VITE_` variable is read at build time and frozen into the artefact, so the image has to
        # be rebuilt to be promoted — which means the thing that reaches production is not the thing
        # that passed CI. Also asserted by test/no-build-time-config.test.ts.
        run: |
          set -uo pipefail
          if grep -rn --include='*.ts' --include='*.tsx' --include='*.html' \
               -e 'import\.meta\.env' -e 'VITE_' src index.html; then
            echo "::error::this bundle must read no build-time environment; hosts come from window.location at runtime"
            exit 1
          fi
          echo "ok: no build-time environment"

      - name: No hard-coded CloudsForge hostname
        # A literal hostname is a second, unversioned copy of the surface registry, and the copy is
        # the one that will be wrong. src/lib/hosts.ts EXPLAINS the rule and has to name a hostname
        # to do it, so comments are stripped first.
        run: |
          set -uo pipefail
          strip() { perl -0pe 's{\{/\*.*?\*/\}}{}gs; s{/\*.*?\*/}{}gs; s{^\s*//.*$}{}gm' "$1"; }
          fail=0
          for f in $(find src -name '*.ts' -o -name '*.tsx'); do
            if strip "$f" | grep -n 'cloudsforge\.online' | sed "s|^|$f:|" | grep .; then fail=1; fi
          done
          [ "$fail" = 0 ] || { echo "::error::derive hosts from window.location.hostname; do not name them"; exit 1; }
          echo "ok: no literal hostnames in src"

      - name: The SPA fallback keeps its 404
        # `try_files $uri /index.html` answers 200 for every address in existence, which makes a
        # "page not found" screen a success: search engines index it, uptime checks call it healthy,
        # and a deploy that drops a route looks exactly like a deploy that did not.
        #
        # Comments stripped first: nginx.conf's own header QUOTES the directive it forbids in order
        # to explain why the routes are enumerated by hand.
        run: |
          set -uo pipefail
          directives=$(grep -v '^[[:space:]]*#' nginx.conf)
          if printf '%s\n' "$directives" | grep -nE 'try_files[[:space:]]+\$uri[[:space:]]+(\$uri/[[:space:]]+)?/index\.html'; then
            echo "::error::unknown paths must 404; serve the shell through error_page 404 /index.html"
            exit 1
          fi
          # `/pool/index.html` since wave 3d: the shell moved into the folder with the bundle, so
          # `error_page 404 /index.html` would name a file the document root no longer holds and
          # nginx would serve its own error page instead of the app's not-found screen.
          grep -q 'error_page 404 /pool/index.html' <<<"$directives"
          echo "ok: unknown paths answer 404"

      - name: No credential can reach the image, and nothing is proxied
        # An image is built once and promoted, so a credential inside one is a published credential.
        # There is also nothing to authenticate with: micro-pool's read API takes no bearer token on
        # any route this bundle calls. Its one credentialled route mints browser-mining tickets and
        # belongs to micro-hub-web's /mine; nothing here calls it, and test/pool-contract.test.ts
        # checks that route by route.
        run: |
          set -uo pipefail
          directives=$(grep -v '^[[:space:]]*#' nginx.conf)
          if printf '%s\n' "$directives" | grep -niE 'proxy_pass|Authorization|Bearer'; then
            echo "::error::this container proxies nothing and holds no credential"
            exit 1
          fi
          dockerfile=$(grep -v '^[[:space:]]*#' Dockerfile)
          if printf '%s\n' "$dockerfile" | grep -niE 'TOKEN|SECRET|PASSWORD'; then
            echo "::error::the image must carry no credential"
            exit 1
          fi
          echo "ok: no proxy, no credential"

      - name: STRATUM IS NOT HTTP AND IS NOT IN THIS CONTAINER
        # Stratum v1 is line-delimited JSON-RPC over raw TCP on 3333/3334. nginx's `http` context
        # cannot carry it, `proxy_pass` would corrupt it, and a reverse proxy answering a
        # `mining.subscribe` with an HTTP 400 presents to the miner's owner as faulty hardware.
        # Exposing those ports is a deploy concern; see the registration section of the PR.
        run: |
          set -uo pipefail
          directives=$(grep -v '^[[:space:]]*#' nginx.conf)
          if printf '%s\n' "$directives" | grep -nE 'listen[[:space:]]+333[34]|^[[:space:]]*stream[[:space:]]*\{'; then
            echo "::error::this is an HTTP container; stratum cannot be carried here"
            exit 1
          fi
          echo "ok: no stratum in the web container"

      - name: Nothing is gated behind a session
        # Every micro-pool route this bundle calls is anonymous, and `account` is a query parameter
        # rather than an authenticated subject. The service's ticket route is not one of them. A
        # gate would make a browser prove who it is before
        # showing facts that are public by construction. Asserted as an ABSENCE, because the reflex
        # is to add one back — and comments are stripped because src/app.tsx NAMES what it refuses.
        run: |
          set -uo pipefail
          strip() { perl -0pe 's{\{/\*.*?\*/\}}{}gs; s{/\*.*?\*/}{}gs; s{^\s*//.*$}{}gm' "$1"; }
          fail=0
          for f in $(find src -name '*.ts' -o -name '*.tsx'); do
            if strip "$f" | grep -nE 'ProtectedRoute|RequireAuth|AuthProvider|Authorization' | sed "s|^|$f:|" | grep .; then fail=1; fi
          done
          [ "$fail" = 0 ] || { echo "::error::every route on this surface renders for everybody"; exit 1; }
          echo "ok: no session, no bearer, no gate"

      - name: The route table, the router and nginx agree
        run: test -f test/routes.test.ts && grep -q 'nginx.conf' test/routes.test.ts

      # ────────────────────────────────────────────────────────────────────────────────────────
      # THE RULE THIS REPOSITORY EXISTS FOR.
      #
      # A mining pool site that implies miners will be paid, when nothing pays them, costs a
      # stranger real electricity on their own hardware for a credit that does not exist.
      # micro-pool's payouts module is a set of types and a function that throws: there is no
      # payouts table, no sink is ever constructed, and four product questions are open in the
      # specification and answered by a person rather than by code.
      #
      # test/honesty.test.ts is the real gate — it renders every address with the loudest fixtures
      # there are, and again with the API failing four different ways. This step is the crude
      # second copy that survives that file being deleted.
      # ────────────────────────────────────────────────────────────────────────────────────────
      - name: No page names an amount a miner is owed
        run: |
          set -uo pipefail
          strip() { perl -0pe 's{<!--.*?-->}{}gs; s{\{/\*.*?\*/\}}{}gs; s{/\*.*?\*/}{}gs; s{^\s*//.*$}{}gm' "$1"; }
          fail=0
          for f in index.html $(find src -name '*.tsx'); do
            if strip "$f" | grep -niE '\bunpaid\b|\bearnings\b|\bnext payout\b|\bpayout threshold\b|\bminimum payout\b|\byour balance\b|\bwithdraw' \
                 | sed "s|^|$f:|" | grep .; then fail=1; fi
          done
          [ "$fail" = 0 ] || {
            echo "::error::nothing on this site may name a figure a miner is owed — not zeroed, not greyed out"
            exit 1
          }
          echo "ok: no page names an amount"

      - name: Nothing on this site promises a date
        # "Not yet", "coming soon" and "will be" all describe a schedule. There is not one. A
        # softened sentence is how "not at all" becomes "not yet, but soon" without anybody
        # deciding to change the claim.
        run: |
          set -uo pipefail
          strip() { perl -0pe 's{<!--.*?-->}{}gs; s{\{/\*.*?\*/\}}{}gs; s{/\*.*?\*/}{}gs; s{^\s*//.*$}{}gm' "$1"; }
          fail=0
          for f in index.html $(find src -name '*.tsx'); do
            if strip "$f" | grep -niE 'coming soon|not yet implemented|in a future release|will be paid' \
                 | sed "s|^|$f:|" | grep .; then fail=1; fi
          done
          [ "$fail" = 0 ] || { echo "::error::this surface states an absence; it never states a schedule"; exit 1; }
          echo "ok: no page promises a date"

      - name: The refusal is DERIVED from the API, not written into the markup
        # The other half, and the reason none of it is a constant: the day micro-pool implements
        # settlement, this site stops saying it does not — without anybody having to remember that
        # it says it, in five different files, one of which is a footer nobody reads.
        run: |
          set -uo pipefail
          grep -q 'payoutsImplemented' src/lib/status.tsx || {
            echo "::error::the honesty state is no longer read from GET /v1/pool"; exit 1; }
          for f in src/pages/mine.tsx src/components/shell.tsx src/pages/blocks.tsx; do
            grep -q 'payoutsImplemented' "$f" || {
              echo "::error::$f states the refusal without branching on the service's own flag"; exit 1; }
          done
          echo "ok: every refusal is branched on payoutsImplemented"

      - name: The chain list comes from the API, never from a list in here
        # `POOL_CHAINS` is per-deployment and only `ltc` is deployable today, because bitcoind is
        # still doing its initial block download. A hard-coded pair would render a two-chain layout
        # with a hole in it on every deployment there is — and DOGE is REFUSED by name, so a list
        # written here would eventually grow one.
        run: |
          set -uo pipefail
          strip() { perl -0pe 's{\{/\*.*?\*/\}}{}gs; s{/\*.*?\*/}{}gs; s{^\s*//.*$}{}gm' "$1"; }
          fail=0
          for f in $(find src -name '*.ts' -o -name '*.tsx'); do
            if strip "$f" | grep -nE "\['ltc'|\"ltc\",|\bchains = \[" | sed "s|^|$f:|" | grep .; then fail=1; fi
          done
          [ "$fail" = 0 ] || { echo "::error::enumerate what /v1/pool reports, not a list written here"; exit 1; }
          echo "ok: the chains are whatever the service says they are"

  image:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { path: pool-web }
      - uses: actions/checkout@v4
        with:
          repository: cloudsforge-online/micro-ui
          path: ui
          token: ${{ secrets.ESTATE_READ_TOKEN || github.token }}

      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: pool-web
          build-contexts: uipkg=ui
          build-args: RELEASE=${{ github.sha }}
          push: false
          load: true
          tags: pool-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # PROBED, NOT READ. Both defects this step guards were invisible in the config and obvious in
      # a response: nginx's `add_header` is all-or-nothing per level, so a location that sets
      # Cache-Control silently loses every inherited security header; and `try_files` is a file
      # lookup rather than an internal redirect, so serving /index.html from `location = /` never
      # enters `location = /index.html`. Reading the file suggests both are fine. Curling it does not.
      - name: The image serves the app, 404s what it does not own, and sends the headers it promises
        run: |
          set -uo pipefail
          # WHERE THIS BUNDLE LIVES INSIDE ITS OWN CONTAINER. `/pool`, wave 3d. Prepended to each
          # probe rather than written into it, so the routes below stay ROUTER paths — the same
          # separation `src/lib/routes.ts` draws — and the mount is stated once.
          BASE=/pool
          docker run -d --name ci-pool-web -p 127.0.0.1:8080:8080 pool-web:ci
          for _ in $(seq 1 30); do
            code=$(curl -s -m 5 -o /dev/null -w '%{http_code}' "http://127.0.0.1:8080$BASE" || true)
            [ "$code" = "200" ] && break
            sleep 1
          done
          [ "${code:-}" = "200" ] || { echo "::error::the image returned ${code:-no answer} for $BASE"; docker logs --tail 60 ci-pool-web; exit 1; }

          fail=0

          # THE TRAILING-SLASH FRONT DOOR, an address this surface did not used to have: the 301
          # from the retired hostname lands on `/pool/`, so a 404 here would meet every reader
          # arriving from a bookmark or an old link.
          slash=$(curl -s -m 5 -o /dev/null -w '%{http_code}' "http://127.0.0.1:8080$BASE/" || true)
          [ "$slash" = "200" ] || { echo "::error::$BASE/ returned $slash"; fail=1; }

          # AND THE ORIGIN ROOT MUST BE EMPTY. Behind the gateway neither address reaches this
          # container — both belong to micro-site — so these are invisible in production and
          # immediate under `docker run`, which is where a wrong `base:` or a wrong `COPY`
          # destination shows up first. An image built for `/pool` but copied to the document root
          # answers 200 here and would shadow the marketing site the moment it deployed.
          for at_root in / /robots.txt; do
            got=$(curl -s -m 5 -o /dev/null -w '%{http_code}' "http://127.0.0.1:8080$at_root" || true)
            [ "$got" = "404" ] || { echo "::error::mounted at $BASE and still answering $got for $at_root"; fail=1; }
          done

          # Every route this app owns must survive a hard refresh. A miner pastes
          # /workers/<chain>/<address> into a chat window and somebody else opens it cold.
          for owned in /workers /workers/ltc/ltc1qexampleaddress /blocks; do
            got=$(curl -s -m 5 -o /dev/null -w '%{http_code}' "http://127.0.0.1:8080$BASE$owned" || true)
            [ "$got" = "200" ] || { echo "::error::$owned returned $got"; fail=1; }
          done

          # A route it does NOT own answers 404 while still serving the shell, so the reader gets a
          # real page and the status line tells the truth. `/payouts` is named explicitly: it is the
          # address somebody will guess, and 404 is the honest answer.
          for unknown in /payouts /earnings /nope/not/a/route /block; do
            got=$(curl -s -m 5 -o /dev/null -w '%{http_code}' "http://127.0.0.1:8080$BASE$unknown" || true)
            [ "$got" = "404" ] || { echo "::error::$unknown returned $got; it must be 404"; fail=1; }
          done
          # NOT A PIPE INTO `grep -q` — the hazard this file already avoids with here-strings
          # elsewhere, on the one check that still had it. grep -q exits at its first match and
          # closes the pipe while curl is still writing; curl dies of EPIPE (23), `pipefail` makes
          # that the pipeline's status, and the `||` then reports that the shell was not served —
          # about a shell that was served perfectly. The log cannot tell that flake from the defect
          # the check exists to catch. Latent here by layout alone, 81 bytes following the match in
          # this repo's index.html, and layout moves: hub-web's 163a319 put the crawler's copy
          # INSIDE `<div id="root">` on 2026-08-09, the match went to byte 7,743 of 12,163, and
          # micro-hub-web#16 then failed here twice in a row with the build green in the same run.
          # Measured 2026-08-10 — micro-org#347. Capturing first leaves no pipe to close early, and
          # `case` is an exact glob rather than a regex.
          shell_404=$(curl -s -m 5 "http://127.0.0.1:8080$BASE/payouts" || true)
          case "$shell_404" in
            *'<div id="root">'*) ;;
            *) echo "::error::the 404 did not serve the app shell"; fail=1 ;;
          esac

          check() { # url, header, expected-substring, label
            got=$(curl -sI "$1" | tr -d '\r' | grep -i "^$2:" | cut -d' ' -f2- || true)
            case "${got:-}" in
              "") echo "::error::$4 is missing $2"; fail=1 ;;
              *"$3"*) echo "  ok   $4: $2: $got" ;;
              *) echo "::error::$4 has the wrong $2 (got '${got:-nothing}', wanted '$3')"; fail=1 ;;
            esac
          }

          # ── TAKE THE SRC AS VITE WROTE IT, NOT A SUBSTRING OF IT ────────────────────────────
          #
          # `grep -oE '/assets/…'` finds the RIGHT TEXT IN THE WRONG PLACE once the bundle is a
          # folder: vite emits `src="/pool/assets/index-x.js"`, and `-o` restarts at successive
          # offsets and treats each as a fresh start, so a leading `/` is not an anchor. It would
          # hand back the path with the mount cut off; the probe would ask for `/assets/index-x.js`,
          # nginx's `location /` would correctly 404 it, and the 404's `no-store` would be reported
          # as "a hashed asset has the wrong Cache-Control". A correct server and a red build.
          # Fixed in micro-trade-web first, on exactly this line.
          shell_html=$(curl -s "http://127.0.0.1:8080$BASE" || true)
          asset=$(tr '<' '\n' <<<"$shell_html" | sed -n 's/.* src="\([^"]*\.js\)".*/\1/p' | head -1)
          case "$asset" in
            "$BASE"/*) : ;;
            "") echo "::error::no module script in the shell at $BASE"; exit 1 ;;
            *) echo "::error::the shell's asset is '$asset', which does not start with $BASE"; exit 1 ;;
          esac
          for target in "http://127.0.0.1:8080$BASE" "http://127.0.0.1:8080$BASE/blocks" "http://127.0.0.1:8080$asset"; do
            check "$target" X-Content-Type-Options "nosniff" "$target"
            # SAMEORIGIN rather than DENY: this is a public reference surface and the Forge Network
            # site has a legitimate reason to embed it. The operator console uses DENY.
            check "$target" X-Frame-Options "SAMEORIGIN" "$target"
            check "$target" Referrer-Policy "strict-origin" "$target"
          done
          check "http://127.0.0.1:8080$BASE" Cache-Control "no-store" "the shell"
          check "http://127.0.0.1:8080$BASE/blocks" Cache-Control "no-store" "an enumerated route"
          check "http://127.0.0.1:8080$asset" Cache-Control "immutable" "a hashed asset"

          # THE RELEASE IS STAMPED. It is what pins an error report to the deploy that introduced it,
          # and it is the one thing in this image that identifies the artefact.
          # `case` on the captured body rather than a pipe into `grep -q`, for the reason given at
          # the 404 check above — micro-org#347.
          release_meta=$(curl -s "http://127.0.0.1:8080$BASE" || true)
          case "$release_meta" in
            *'name="cf-release" content="${{ github.sha }}"'*) ;;
            *) echo "::error::the release was not stamped into index.html"; fail=1 ;;
          esac

          # A TESTNET POOL MUST NOT COMPETE WITH MAINNET IN SEARCH RESULTS. The page it serves is a
          # set of connection instructions, and a miner who lands on the testnet copy is handed a
          # stratum address that will accept their hardware and credit shares against a chain whose
          # coins are worth nothing.
          # `case` on the captured body rather than a pipe into `grep -q`, for the reason given at
          # the 404 check above — micro-org#347.
          # ── THE robots.txt PROBES ARE GONE, BECAUSE THE DOCUMENT IS ────────────────────────
          #
          # A crawler reads robots.txt at the ORIGIN ROOT, and this bundle is a folder now, so the
          # one robots.txt on the apex is micro-site's. `site/test/routes.test.ts` asserts its
          # contents; the `/robots.txt` 404 above asserts that THIS image does not serve a second
          # one. Probing for `Allow: /` here would have been asserting the presence of a document
          # this container must not have.
          #
          # The `$cf_env` refusal it used to check has not been lost — micro-site's robots.txt has
          # an identical one, so a testnet apex answers `Disallow: /` and covers this surface by
          # construction. The sitemap half below still belongs here and still runs.
          env404=$(curl -s -m 5 -o /dev/null -w '%{http_code}' -H 'Host: testnet.cloudsforge.online' "http://127.0.0.1:8080$BASE/sitemap.xml" || true)
          [ "$env404" = "404" ] || { echo "::error::a non-mainnet hostname served a sitemap ($env404)"; fail=1; }

          # This public reference surface must NOT be kept out of an index.
          robots=$(curl -sI http://127.0.0.1:8080/ | tr -d '\r' | grep -ci '^X-Robots-Tag:' || true)
          [ "${robots:-0}" = "0" ] || { echo "::error::this public surface sends X-Robots-Tag"; fail=1; }

          # The brand chrome is SERVED by the image, not merely committed to the repository.
          for asset in favicon-32x32.png favicon-192x192.png favicon-512x512.png og-1200x630.png; do
            code=$(curl -s -m 5 -o /dev/null -w '%{http_code}' "http://127.0.0.1:8080$BASE/$asset" || true)
            [ "$code" = "200" ] || { echo "::error::/$asset returned $code from the image"; fail=1; }
          done

          docker rm -f ci-pool-web >/dev/null 2>&1 || true
          exit $fail

      # ────────────────────────────────────────────────────────────────────────────────────────
      # THE ONE PIECE OF PER-DEPLOYMENT CONFIGURATION THIS IMAGE HAS — micro-org#406.
      #
      # PROBED, NOT READ, and for the reason the step above gives: everything about this mechanism
      # is invisible in the config and obvious in a response. The template only becomes a document
      # if nginx's own entrypoint expands it (`/docker-entrypoint.d/20-envsubst-on-templates.sh`),
      # which it does only when the command is `nginx`, only for `/etc/nginx/templates/*.template`,
      # and only if it can write to `/etc/nginx/conf.d` as uid 101. Reading the Dockerfile suggests
      # all three. Curling the container is the only thing that establishes them.
      #
      # Both directions are asserted, because each has a distinct and expensive failure:
      #
      #   - UNSET MUST NOT MEAN ABSENT, AND MUST NOT MEAN DOWN. Every existing deployment of this
      #     image, mainnet included, has never heard of `POOL_API_PRESENCE`. Measured 2026-08-11:
      #     the first version of this mechanism EXITED 1 on such a deployment with
      #     `nginx: [emerg] unknown "pool_api_presence" variable`, because the entrypoint only
      #     substitutes variables that are set and left the placeholder in the config verbatim. The
      #     Dockerfile's `ENV POOL_API_PRESENCE=present` is the fix, and this step is what would
      #     have caught it — the config reads correctly either way, and the container does not.
      #   - SET MUST REACH THE BUNDLE. A flag that expands to nothing is a configuration mechanism
      #     that configures nothing, and the console would go on rendering three error states on
      #     testnet exactly as it did on 2026-08-11 — with a green build.
      # ────────────────────────────────────────────────────────────────────────────────────────
      - name: The deployment document is served, and the environment is what decides it
        run: |
          set -uo pipefail
          # Same mount as the step above, and the same reason: this container serves nothing at the
          # origin root, so every probe here is `$BASE`-relative. `/pool/deployment.json` is the
          # document itself — it moved with the bundle because the bundle's own nginx serves it.
          BASE=/pool
          fail=0

          probe() { # container-name, docker-run-args…
            name=$1; shift
            docker rm -f "$name" >/dev/null 2>&1 || true
            docker run -d --name "$name" -p 127.0.0.1:8081:8080 "$@" pool-web:ci >/dev/null
            for _ in $(seq 1 30); do
              code=$(curl -s -m 5 -o /dev/null -w '%{http_code}' "http://127.0.0.1:8081$BASE" || true)
              [ "$code" = "200" ] && break
              sleep 1
            done
            [ "${code:-}" = "200" ] || { echo "::error::$name did not start"; docker logs --tail 60 "$name"; fail=1; }
          }

          # ── a deployment that says nothing, i.e. every one that exists today ──────────────────
          probe ci-pool-web-default
          got=$(curl -s -m 5 "http://127.0.0.1:8081$BASE/deployment.json" || true)
          echo "  default: $got"
          case "$got" in
            *'"poolApi"'*) ;;
            *) echo "::error::/deployment.json did not serve the document (got '${got:-nothing}'); the template was never expanded"; fail=1 ;;
          esac
          case "$got" in
            *'"absent"'*) echo "::error::an unconfigured image reports that there is no pool behind it"; fail=1 ;;
          esac
          # The security headers are per-location in nginx and `add_header` is all-or-nothing at
          # each level, so a new location loses every inherited one silently. This one sets its own;
          # this is the check that it really did.
          for header in X-Content-Type-Options X-Frame-Options Referrer-Policy; do
            curl -sI -m 5 "http://127.0.0.1:8081$BASE/deployment.json" | tr -d '\r' | grep -qi "^$header:" || {
              echo "::error::/deployment.json is missing $header"; fail=1; }
          done
          # JSON, not the `types { }` default and not the SPA shell.
          ctype=$(curl -sI -m 5 "http://127.0.0.1:8081$BASE/deployment.json" | tr -d '\r' | grep -i '^content-type:' || true)
          case "$ctype" in
            *application/json*) ;;
            *) echo "::error::/deployment.json is served as '${ctype:-nothing}'"; fail=1 ;;
          esac
          docker rm -f ci-pool-web-default >/dev/null 2>&1 || true

          # ── a deployment on a network with no pool, which is what compose will set ────────────
          probe ci-pool-web-absent -e POOL_API_PRESENCE=absent
          got=$(curl -s -m 5 "http://127.0.0.1:8081$BASE/deployment.json" || true)
          echo "  absent:  $got"
          case "$got" in
            *'"poolApi":"absent"'*) ;;
            *) echo "::error::POOL_API_PRESENCE=absent did not reach the document (got '${got:-nothing}')"; fail=1 ;;
          esac
          docker rm -f ci-pool-web-absent >/dev/null 2>&1 || true

          # ── and the flag changes nothing else about the container ────────────────────────────
          probe ci-pool-web-still -e POOL_API_PRESENCE=absent
          for owned in '' /workers /blocks; do
            code=$(curl -s -m 5 -o /dev/null -w '%{http_code}' "http://127.0.0.1:8081$BASE$owned" || true)
            [ "$code" = "200" ] || { echo "::error::$owned returned $code with the flag set"; fail=1; }
          done
          code=$(curl -s -m 5 -o /dev/null -w '%{http_code}' "http://127.0.0.1:8081$BASE/payouts" || true)
          [ "$code" = "404" ] || { echo "::error::/payouts returned $code with the flag set"; fail=1; }
          docker rm -f ci-pool-web-still >/dev/null 2>&1 || true

          exit $fail

      - name: Down
        if: always()
        run: docker rm -f ci-pool-web ci-pool-web-default ci-pool-web-absent ci-pool-web-still || true

  hygiene:
    # The org's reusable secret check. Cheap, and it catches the failure that cannot be undone: a
    # secret pushed to a repository is compromised the moment it lands, and rotating it is the only
    # remedy. It matters more on a PUBLIC repository, which this one is.
    uses: cloudsforge-online/micro-org/.github/workflows/secret-hygiene.yml@main
    permissions:
      contents: read

  # ────────────────────────────────────────────────────────────────────────────────────────────────
  # THE IMAGE, PUBLISHED. The `image` job above is a GATE — it needs `load:` so it can boot the
  # container and probe it, and it throws the result away. This is the PRODUCER. Different purposes,
  # so different jobs.
  #
  # A frontend with no producer is a manifest entry that can never verify: `cfctl release` pins one
  # image per deployable, `cfctl release --verify` runs `docker manifest inspect` on every entry, and
  # `release-deploy.sh` refuses to change anything while one image is missing.
  #
  # `packages: write` IS GRANTED HERE rather than asked for inside the shared workflow, and that is
  # forced rather than stylistic: a called workflow's GITHUB_TOKEN can only be maintained or reduced,
  # never elevated, so a reusable workflow asking for a permission its caller withheld fails the run
  # at STARTUP, before a step runs. Measured on micro-org: the run whose caller capped at
  # `packages: read` ended in startup_failure; the same workflow with a caller granting
  # `packages: write` succeeded.
  #
  # `needs:` names EVERY other job, so nothing is published that did not pass every gate here.
  # ────────────────────────────────────────────────────────────────────────────────────────────────
  publish:
    needs: [check, rules, image, hygiene]
    # A green push to main and nothing else. An image tag a release manifest pins has to name
    # something that passed, on the branch it will be deployed from.
    if: >-
      github.event_name == 'push' && (github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/heads/design-system/') ||
      startsWith(github.ref, 'refs/heads/release/'))
    uses: cloudsforge-online/micro-org/.github/workflows/publish-image.yml@main
    with:
      # `web`, so the producer checks micro-ui out as the `uipkg` named build context this
      # repository's Dockerfile reads. It names ONLY the contexts its kind checked out, because
      # buildx stats every named context before it opens the Dockerfile.
      kind: web
    secrets:
      estate_token: ${{ secrets.ESTATE_READ_TOKEN }}
    permissions:
      contents: read
      packages: write
