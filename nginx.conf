# The Mining Pool's server block.
#
# THE ONE THING TO UNDERSTAND HERE: an unknown path answers 404, not 200.
#
# The usual SPA fallback is `try_files $uri /index.html`, which serves the bundle with a 200 for
# every address in existence. That makes a "page not found" screen a success: search engines index
# it, uptime checks call it healthy, link checkers pass, and a deploy that drops a route looks
# exactly like a deploy that did not.
#
# So the client routes are ENUMERATED below and everything else falls through to
# `error_page 404 /index.html`, which serves the same bundle while KEEPING the 404 status. React
# renders NotFoundPage inside it and the status line tells the truth.
#
# The cost is that this list and `ROUTES` in src/lib/routes.ts must agree. That is one line per
# route, paid once per route, and test/routes.test.ts reads this file and fails the build when they
# drift. "Remember to update nginx.conf" is not a mechanism; a test is.
#
# ── THERE IS NO PROXY IN THIS FILE, AND THERE IS NO STRATUM IN IT EITHER ───────────────────────
#
# Two separate absences, and the second is particular to this surface.
#
# No `proxy_pass` for `/v1`: in production this bundle and micro-pool share `pool.<apex>` and the
# API requests are relative, exactly as explorer-web and micro-indexer share `explorer.<apex>`.
# Routing `/v1` to the service is the gateway's job (`deploy/gateway/dynamic/`), not this
# container's. A `proxy_pass` here that added an `Authorization` header would also put a CloudsForge
# service credential inside an image that is built once and promoted, which is a published
# credential — and micro-pool's read API takes no credential at all, so there is nothing to add.
#
# No stratum: Stratum v1 is line-delimited JSON-RPC over RAW TCP on ports 3333 and 3334
# (`pool/src/env.ts`). It is not HTTP. nginx's `http` context cannot carry it, `proxy_pass` here
# would corrupt it, and a reverse proxy that answered a `mining.subscribe` with an HTTP 400 would
# present to the miner's owner as faulty hardware. Exposing those TCP ports is a deploy concern and
# has nothing to do with this container — see the registration section of the pull request.

# ── IS THIS HOSTNAME AN ENVIRONMENT OTHER THAN MAINNET? ────────────────────────────────────────
#
# `map` is in http context, which is why it sits above the server block rather than inside it — a
# conf.d file is included in http, so this is legal here and would not be legal ten lines down.
#
# THE LABELS ARE `ENV_LABELS` FROM @cloudsforge/ui, and test/seo.test.ts reads that export and fails
# if this alternation has drifted from it. They are the words that name an environment rather than a
# surface: `surfaces.ts` reserves them so no surface may take one as a subdomain.
#
# It matters more here than on most surfaces. A testnet pool and a mainnet pool are two deployments
# of one image on two hostnames, and the page they both serve is a set of CONNECTION INSTRUCTIONS. A
# miner who searches for a CloudsForge pool and lands on the testnet copy is handed a stratum
# address that will happily accept their hardware and credit their shares against a chain whose
# coins are worth nothing. `Disallow: /` on every non-mainnet hostname is what stops that page from
# competing for the search result.
#
# `(?:[^.]+-)?` catches BOTH shapes, for the same reason `placementOf()` in src/lib/hosts.ts
# resolves both: the environment is a suffix on the first label now (`pool-testnet.<apex>`) and was
# an apex prefix before (`testnet.<apex>`).
map $host $cf_env {
    default '';
    ~^(?:[^.]+-)?(?:testnet|staging|preview|dev|mainnet)\. 'yes';
}

server {
    # 8080 because the image is nginx-unprivileged: nothing in this container is root, and a
    # non-root process cannot bind 80. This is a fact about the IMAGE only, and it is not the
    # registry's devPort — that is 4146, which is the port micro-pool's own HTTP surface binds.
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Client-side routing is real routing: the address must survive a hard refresh. A miner pastes
    # `/workers/ltc/<address>` into a chat window and somebody else opens it cold.
    absolute_redirect off;

    # ---- security headers ------------------------------------------------
    # SAMEORIGIN rather than DENY: this is a public reference surface and the Forge Network site has
    # a legitimate reason to embed it, unlike the operator console, which has none and uses DENY.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---- assets ----------------------------------------------------------
    # Immutable, because every build emits new hashed filenames. A missing asset is a 404 on its own
    # terms and must NOT fall through to the app shell: a JavaScript request answered with HTML
    # fails with a syntax error that names the wrong file.
    location /assets/ {
        try_files $uri =404;
        # REPEATED, NOT INHERITED. nginx's `add_header` is all-or-nothing per level: a location that
        # declares ANY add_header inherits NONE from its parent. So every location below that sets
        # Cache-Control must restate the security headers, or it silently serves without them —
        # which is exactly what `location /assets/` did in the web template, stripping nosniff from
        # every hashed script in every frontend cut from it.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # index.html is never cached. It is the file that names the current asset hashes, so a stale copy
    # pins a browser to a deploy that no longer exists.
    location = /index.html {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-store" always;
    }

    # ---- the client routes, enumerated -----------------------------------
    # Keep in step with ROUTES in src/lib/routes.ts. test/routes.test.ts reads both.
    location = / {
        try_files /index.html =404;
        # `try_files` is a FILE LOOKUP, not an internal redirect, so serving /index.html here does
        # NOT re-enter `location = /index.html` above — and this location therefore has to declare
        # the shell's no-store itself. Without it `/` ships with no Cache-Control at all, which is
        # the one document that must never be cached: it names the hashed bundle.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-store" always;
    }

    location ~ ^/(workers|blocks)(/|$) {
        try_files /index.html =404;
        # Same reason as `location = /` above: try_files does not re-enter, so restate them all.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-store" always;
    }

    # ---- the sitemap and robots.txt, emitted with $host -------------------
    # THEY ARE HERE RATHER THAN IN public/ FOR THE ONE REASON THAT DECIDES IT: a sitemap must carry
    # ABSOLUTE URLs — the spec requires it and a crawler discards a relative `<loc>` — and nothing
    # built in this repository is allowed to name a hostname, because one image is served from
    # localhost, from a preview deployment and from two production estates
    # (test/no-build-time-config.test.ts). nginx is the component that knows: it has `$host` on every
    # request, so the addresses are composed per request and the artefact stays environment-free.
    #
    # This is NOT `sitemapXml()` from @cloudsforge/ui, because THIS SURFACE IS NOT THE APEX. The
    # shared generator composes every sibling as `<subdomain>.$host`, which is right on the marketing
    # site where `$host` IS the apex. Here `$host` is already `pool.<apex>`, so the same generator
    # would emit `network.pool.<apex>` — a two-label hostname that resolves to nothing and fails the
    # edge's one-label wildcard certificate.
    #
    # `/workers/<chain>/<account>` IS DELIBERATELY ABSENT, and this is the entry a crawler would most
    # like to have. It is unbounded — one address per miner, minted by whoever points hardware here —
    # and it is also somebody's mining address: publishing a list of them in the one document a
    # crawler treats as authoritative would turn this pool's index into an address directory. The
    # lookup form at `/workers` is what resolves a paste into one of them, and that is listed.
    location = /sitemap.xml {
        # `types { }` empties the mime table FOR THIS LOCATION so `default_type` is what applies.
        # Without it nginx maps the `.xml` in the URI to `text/xml` from its own table and the
        # `default_type` line is inert — a declaration that reads as a decision and is not one.
        types { }
        default_type application/xml;
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # An environment that must not be indexed has no sitemap. `return` inside `if` is one of the
        # two uses of `if` in a location that are defined behaviour rather than a trap.
        if ($cf_env) { return 404; }
        return 200 '<?xml version="1.0" encoding="UTF-8"?>
<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">
  <url><loc>$scheme://$host</loc></url>
  <url><loc>$scheme://$host/workers</loc></url>
  <url><loc>$scheme://$host/blocks</loc></url>
</urlset>';
    }

    location = /robots.txt {
        types { }
        default_type text/plain;
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # Every environment but mainnet refuses every crawler, whole. See the `map` above for why
        # that is sharper here than elsewhere.
        if ($cf_env) { return 200 'User-agent: *\nDisallow: /\n'; }
        return 200 'User-agent: *
Allow: /

Sitemap: $scheme://$host/sitemap.xml
';
    }

    # ---- everything else -------------------------------------------------
    # A real file (a favicon, the og card) is served; anything else 404s, and the error page below
    # turns that 404 into the app shell WITHOUT changing the status.
    location / {
        try_files $uri =404;
    }

    error_page 404 /index.html;

    # nginx's own health, for the container probe. It answers before the app has been fetched, so it
    # says the server is up — never that the product works. On this surface a green probe says
    # nothing at all about whether the pool is accepting stratum connections, which is a different
    # process on a different port that this container cannot see.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
